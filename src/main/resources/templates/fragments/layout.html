<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · Blog'">Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="nav" class="topbar">
    <div class="nav-inner">
        <a class="brand" th:href="@{/posts}">Blog</a>
        <div class="nav-links">
            <a th:href="@{/posts}">文章</a>
            <a th:href="@{/me/posts}">我的文章</a>
            <a th:href="@{/posts/new}">写文章</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">管理</a>
        </div>
        <div class="nav-user">
            <span th:text="${currentUser.nickname}">用户</span>
            <form th:action="@{/logout}" method="post">
                <button class="link-button" type="submit">退出</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
