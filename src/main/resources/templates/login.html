<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('登录')}"></head>
<body class="login-page">
<main class="login-card">
    <div class="login-mark">B</div>
    <h1>欢迎回来</h1>
    <p class="muted">登录后查看你的知识记录</p>
    <div class="alert error" th:if="${param.error}">用户名或密码错误</div>
    <div class="alert success" th:if="${param.logout}">你已安全退出</div>
    <form th:action="@{/login}" method="post" class="stack-form">
        <label>用户名
            <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label>密码
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="primary-button" type="submit">登录</button>
    </form>
    <p class="login-note">账号由管理员维护，本站不开放注册。</p>
</main>
</body>
</html>
