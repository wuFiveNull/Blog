<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('文章')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="page-shell">
    <section class="page-heading">
        <div>
            <p class="eyebrow">PRIVATE KNOWLEDGE BASE</p>
            <h1>文章</h1>
            <p class="muted">记录实习、项目和技术思考。</p>
        </div>
        <a class="primary-button" th:href="@{/posts/new}">写一篇</a>
    </section>
    <form class="search-bar" th:action="@{/posts}" method="get">
        <input type="search" name="q" th:value="${query}" placeholder="搜索文章标题">
        <select name="category">
            <option value="" th:selected="${selectedCategory == ''}">全部分类</option>
            <option th:each="category : ${categoryOptions}"
                    th:value="${category.name}"
                    th:text="${category.name}"
                    th:selected="${category.name == selectedCategory}">分类</option>
        </select>
        <select name="tag">
            <option value="" th:selected="${selectedTag == ''}">全部标签</option>
            <option th:each="tagOption : ${tagOptions}"
                    th:value="${tagOption.name}"
                    th:text="'#' + tagOption.name"
                    th:selected="${tagOption.name == selectedTag}">#标签</option>
        </select>
        <button class="secondary-button" type="submit">搜索</button>
    </form>
    <div class="empty-state" th:if="${#lists.isEmpty(posts)}">
        <h2>还没有可见文章</h2>
        <p class="muted">写下第一篇记录吧。</p>
    </div>
    <section class="post-grid" th:unless="${#lists.isEmpty(posts)}">
        <article class="post-card" th:each="post : ${posts}">
            <div class="post-card-meta">
                <span th:text="${#temporals.format(post.publishedAt, 'yyyy-MM-dd')}">2026-01-01</span>
                <span th:text="${post.author.nickname}">作者</span>
                <span th:if="${post.category != null}" th:text="${post.category.name}">分类</span>
            </div>
            <h2><a th:href="@{/posts/{slug}(slug=${post.slug})}" th:text="${post.title}">标题</a></h2>
            <p class="post-summary" th:text="${post.summary != null ? post.summary : '暂无摘要'}">摘要</p>
            <div class="tag-list">
                <a class="tag" th:each="tag : ${post.tags}"
                   th:href="@{/posts(tag=${tag.name})}"
                   th:text="'#' + tag.name">#标签</a>
            </div>
        </article>
    </section>
</main>
</body>
</html>
