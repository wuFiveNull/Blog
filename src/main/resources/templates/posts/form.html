<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${postForm.id == null ? '写文章' : '编辑文章')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="editor-shell">
    <div class="page-heading compact">
        <div>
            <p class="eyebrow">MARKDOWN EDITOR</p>
            <h1 th:text="${postForm.id == null ? '写一篇文章' : '编辑文章'}">写一篇文章</h1>
        </div>
        <a class="secondary-button" th:href="@{/me/posts}">取消</a>
    </div>
    <form id="post-form" class="editor-form"
          th:action="${postForm.id == null ? '/posts' : '/posts/' + postForm.id}"
          th:object="${postForm}" method="post">
        <label>标题
            <input th:field="*{title}" maxlength="180" required>
        </label>
        <label>摘要
            <input th:field="*{summary}" maxlength="500" placeholder="一句话说明这篇文章">
        </label>
        <div class="editor-toolbar">
            <label class="inline-label">可见角色</label>
            <label class="check-label"><input type="checkbox" class="role-choice" value="ADMIN"> 管理员</label>
            <label class="check-label"><input type="checkbox" class="role-choice" value="OWNER"> 我自己</label>
            <label class="check-label"><input type="checkbox" class="role-choice" value="USER"> 其他用户</label>
            <input id="allowedRoles" type="hidden" th:field="*{allowedRoles}">
        </div>
        <label>标签
            <input th:field="*{tags}" placeholder="实习, Java, 项目经验">
        </label>
        <div class="editor-grid">
            <label>Markdown 正文
                <textarea id="contentMarkdown" th:field="*{contentMarkdown}" rows="24"
                          placeholder="# 标题&#10;&#10;开始记录..." required></textarea>
            </label>
            <section class="preview-panel">
                <div class="preview-heading">
                    <span>预览</span>
                    <button id="preview-button" class="text-button" type="button">刷新预览</button>
                </div>
                <div id="preview" class="markdown-body preview-body">
                    <p class="muted">点击“刷新预览”查看 Markdown 效果。</p>
                </div>
            </section>
        </div>
        <div class="upload-row">
            <input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
            <button id="upload-button" class="secondary-button" type="button">上传图片并插入</button>
            <span id="upload-message" class="muted"></span>
        </div>
        <div class="form-actions">
            <label class="check-label"><input th:field="*{publish}" type="checkbox"> 保存后发布</label>
            <button class="primary-button" type="submit">保存文章</button>
        </div>
    </form>
</main>
<script th:src="@{/js/editor.js}"></script>
</body>
</html>
