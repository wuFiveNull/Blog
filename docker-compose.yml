services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - blog_mysql_data:/var/lib/mysql

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-blog}
      DB_USERNAME: ${MYSQL_USER:-blog}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      BLOG_STORAGE_PATH: /app/storage/uploads
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_SEED_ADMIN_USERNAME: ${APP_SEED_ADMIN_USERNAME:-admin}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-}
      APP_SEED_OWNER_USERNAME: ${APP_SEED_OWNER_USERNAME:-owner}
      APP_SEED_OWNER_PASSWORD: ${APP_SEED_OWNER_PASSWORD:-}
      APP_SEED_USER_USERNAME: ${APP_SEED_USER_USERNAME:-user}
      APP_SEED_USER_PASSWORD: ${APP_SEED_USER_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - ./storage/uploads:/app/storage/uploads

volumes:
  blog_mysql_data:
